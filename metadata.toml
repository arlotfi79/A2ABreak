claim2 = """
RQ2 / Table 1 (Section 5): benchmarked against the TCP ground-truth state
machine from PSMBench, the pipeline recovers all 11 protocol states and 19 of
20 ground-truth transitions, at precision 0.760, recall 0.950 and F1 0.844.
"""
script2 = "https://github.com/arlotfi79/A2ABreak/blob/main/scripts/claim2_tcp_psmbench.sh"
expected2 = """
REPRODUCES AS AN EXPERIMENT; DIFFERS FROM TABLE 1 AS PRINTED. The PSMBench TCP
run is complete and pinned (run_key 2cd85b6f01, with SHA-256 recorded for the
exported FSM, the ground truth and PSMBench's own unmodified evaluator), so
`python3 main.py eval --protocol TCP` re-scores it and returns our numbers: 75
extracted transitions, 15 of 20 matched at P 0.200 / R 0.750 / F1 0.316, and 10
of 11 states. Table 1 reports 25 extracted and 19 matched at P 0.760 / R 0.950 /
F1 0.844. The difference is in the export (75 edges versus 25), not the scoring,
