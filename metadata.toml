install_script = "https://github.com/arlotfi79/A2ABreak/blob/main/scripts/install.sh"

use = """
Intended for studying the security properties of the A2A protocol, for reusing
the extracted statement corpus and unified finite-state machine as a formal
model of the A2A lifecycle, and for applying the extraction methodology to
other natural-language protocol specifications.

Not suitable for: testing or attacking live A2A deployments; auditing a
specific implementation, since every finding is design-level and says nothing
about any implementation's correctness; use as an A2A reference implementation,
which this is not; automated vulnerability scanning.

Limitations. LLM-assisted stages are not bit-reproducible -- re-running
produces similar but not identical output -- which is why claim verification
recomputes the paper's numbers from the shipped outputs rather than re-running
the pipeline. The analysed source document is A2A specification v1.0.0,
retrieved 2026-05-13, but src/config.yaml fetches it from the site's "latest"
path, which aliases the dev branch rather than a tagged release -- so a fresh
run today reads a much later document. Pin to
https://a2a-protocol.org/v1.0.0/specification/ to reproduce Stage A. Five of the seven claims reproduce the paper's numbers
exactly; two carry a documented caveat, and CLAIMS.md states which and why.
"""

destructive = """
None. The artifact performs no destructive action.

Writes are confined to the repository directory: .venv/, src/outputs/,
formal_verification/tools/ and results/, PSM_Benchmark/protocols/<P>/output/,
PSM_Benchmark/tests/_scratch/, and symlinks at the repository root created by
scripts/link_pipeline.sh (removable with --unlink). Nothing is installed or
modified outside the repository.

The PSMBench clone at RFC_PSM_Benchmark/ is treated as strictly read-only: the
harness symlinks into it rather than copying, sets sys.dont_write_bytecode so
it never gains a __pycache__, and aborts if the clone is dirty.

The one real cost is financial: live re-runs bill the Anthropic API. A full
reproduction is roughly $308. Tiers 0 and 1, which verify all seven claims,
make no API calls and cost nothing.
"""

