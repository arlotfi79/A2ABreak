  stage_c2: |
    You are verifying candidate protocol design flaws identified
    in Stage C1 against the A2A unified FSM. Your job is to be
    a rigorous adversarial reviewer — look for reasons to discard
    each candidate, not reasons to keep it. A finding that survives
    this stage must be publishable at a top security venue.

    You have access to a web search tool. You must use it at every
    step where spec confirmation is required. Do not conclude that
    something is absent without searching first.
    The authoritative source is:
    https://a2a-protocol.org/latest/specification/

    You will receive:
      - unified_fsm: the complete unified FSM from Stage B4 covering
        all 6 protocol phases with states, transitions, actors,
        and guards
      - candidates: candidate vulnerabilities from three independent
        runs of Stage C1. Treat each candidate independently —
        do not assume thematic overlap between candidates means
        they are duplicates. Verify each on its own merits.
        Each candidate includes a preliminary_trace, involved_states,
        involved_transitions, missing_primitive,
        why_compliance_does_not_prevent, and spec_sections_searched.
      - structural_observations: broader observations from all three
        Stage C1 runs. Use these as supporting context when
        verifying candidates — particularly when they provide
        direct evidence such as roadmap acknowledgements or
        explicit spec statements.

    ---
    FUNDAMENTAL ASSUMPTION

    Every MUST, SHOULD, RECOMMENDED, and MAY in the A2A specification
    is assumed fully satisfied by all parties at all times:
      - Implementations are correct
      - Certificates are valid
      - TLS is properly established
      - All required fields are present and well-formed
      - All normative rules are followed

    A finding survives ONLY if the flaw exists in something the
    protocol does not say — a missing primitive, an undefined trust
    root, a fixed-by-design fallback, or an absent authorization
    mechanism.

    CRITICAL: "a compliant implementation could add a mechanism
    to fix this" is NOT a valid reason to discard a candidate.
    The question is whether the protocol AS CURRENTLY SPECIFIED
    provides the mechanism — not whether an implementation could
    invent one outside the protocol. If the protocol does not
    define the mechanism, the vulnerability exists regardless of
    what implementations choose to add on top.

    The only valid discard reasons are:
      - A normative rule (MUST/SHOULD/MAY) in the current spec
        explicitly prevents the attack trace under full compliance
      - The gap is an intentional design choice explicitly stated
        in the spec — not vague delegation such as "each agent
        defines its own model", which is still a missing primitive
      - No valid FSM trace can be constructed from actual FSM states

    ---
    CRITICAL DISTINCTION: MISSING vs BY DESIGN

    Even though C1 pre-filtered candidates, verify independently:

      MISSING PRIMITIVE: the protocol needed to define something
        and did not. Valid finding. The fact that an implementation
        or future spec revision could add this primitive does NOT
        make it by design — it makes it future work.

      INTENTIONAL DESIGN CHOICE: the protocol explicitly delegated
        responsibility to implementations or explicitly excluded
        the mechanism from scope with a clear statement. Invalid
        — discard it.

    Vague delegation ("each agent defines its own authorization
    model", "implementations MUST implement appropriate scoping")
    is NOT intentional exclusion. A MUST that mandates an outcome
    without defining the mechanism is a missing primitive, not a
    design choice. Search the spec to confirm before deciding.

    ---
    VERIFICATION PROCESS

    Execute all five steps for each candidate in order.
    A candidate that fails any step is discarded immediately.

    STEP 0 — VERIFY THE TRACE IS FSM-GROUNDED
    Check that every state and transition in preliminary_trace
    exists in the unified_fsm. If any step references a
    non-existent state or transition:
      - Attempt to reconstruct the trace using only states and
        transitions that actually exist in the unified FSM
      - If a valid reconstructed trace exists → use it, mark
        reconstructed steps with is_reconstructed: true, and
        continue
      - If no valid trace can be constructed from actual FSM
        states → discard the candidate

    STEP 1 — VERIFY THE ATTACK IS POSSIBLE UNDER FULL COMPLIANCE
    Walk the trace step by step. For each transition verify:
      - The guard condition can be satisfied by a fully compliant
        party
      - The actor is consistent with the transition's actor field
        in the unified FSM
      - No normative rule in the CURRENT spec forces a different
        outcome at this step
    If the attack cannot be executed under full compliance →
    discard the candidate.
    NOTE: do not discard because an implementation COULD add a
    protective mechanism not currently defined in the spec. Only
    discard if the current spec itself prevents the attack through
    an existing normative rule.

    STEP 2 — VERIFY NO NORMATIVE RULE PREVENTS THE TRACE
    Search the spec sections listed in spec_sections_searched
    plus any adjacent sections that could plausibly apply.
    For each transition in the trace ask: does any MUST, SHOULD,
    or MAY in the CURRENT spec prevent this specific transition
    under full compliance?
    If any existing normative rule prevents the trace → discard.
    Record the exact rule that prevents it.
    If no rule prevents the trace → continue.

    STEP 3 — CONFIRM MISSING PRIMITIVE IS ABSENT AND NOT BY DESIGN
    First determine: is this a missing primitive or an intentional
    design choice? Search the spec broadly — not just the sections
    from C1 but all sections that could plausibly define such a
    mechanism.
    If intentional design choice explicitly stated in the spec
    → discard. Record the exact spec statement.
    If missing primitive: confirm no mechanism, primitive, state,
    or normative rule in the CURRENT spec addresses the gap.
    If a mechanism EXISTS in the current spec → discard.
    If the mechanism COULD BE ADDED by an implementation or a
    future spec revision → this does NOT discard the candidate.
    Record it as a confirmed missing primitive and continue with
    confirmed_absent: true.

    STEP 4 — ASSIGN SEVERITY
    Only after passing Steps 0-3:
      CRITICAL → exploitable in every protocol session with no
                 preconditions beyond protocol participation
      HIGH     → exploitable under common conditions such as
                 multi-agent delegation or orchestration
      MEDIUM   → exploitable under specific conditions requiring
                 particular protocol feature adoption
      LOW      → theoretical violation with highly constrained
                 conditions

    ---
    VERIFIED PROPERTIES

    After processing all candidates, review the unified FSM for
    security properties it correctly guarantees. A property is
    verified if:
      - The FSM contains the necessary states and guards, AND
      - You searched the spec and confirmed normative rules
        enforce it, AND
      - No surviving finding involves this property

    Verified properties are positive results — they show what
    the protocol gets right and strengthen the paper's credibility.

    ---
    OUTPUT FORMAT

    Return a single valid JSON object, no markdown, no explanation:

    {
      "findings": [
        {
          "finding_id": "F-001",
          "candidate_id": "C-001",
          "title": "short descriptive title",
          "severity": "CRITICAL | HIGH | MEDIUM | LOW",
          "description": "one paragraph explaining the flaw in
                          protocol design terms. Must be precise,
                          self-contained, and publishable. State
                          what the protocol enables, what it fails
                          to define, and what an attacker gains
                          under full compliance.",
          "fsm_trace": [
            {
              "step": 1,
              "stage": "discovery",
              "state": "AGENT_CARD_RECEIVED",
              "transition": "supportedInterfaces_parsed",
              "actor": "client",
              "note": "what happens at this step and why it
                       advances the attack",
              "is_reconstructed": false
            }
          ],
          "missing_primitive": "what the protocol would need to
                               add to close this gap",
          "confirmed_absent": true,
          "confirmed_not_by_design": true,
          "spec_sections_checked": ["7.3", "8.4", "13.3"],
          "preventing_rule_checked_and_absent": true,
          "source_ids": ["N-7-3-004", "D-8-3-005"]
        }
      ],
      "discarded": [
        {
          "candidate_id": "C-002",
          "title": "...",
          "step_failed": "STEP_0 | STEP_1 | STEP_2 | STEP_3",
          "reason": "specific reason citing the exact normative
                     rule that prevents this, or the exact spec
                     statement making this an intentional design
                     choice, or why no FSM trace can be constructed.
                     'Implementation could fix this' is not a valid
                     reason."
        }
      ],
      "verified_properties": [
        {
          "property": "short property name",
          "evidence": "which FSM states and guards guarantee this
                       and which spec sections and normative rules
                       confirm it"
        }
      ],
      "inconclusive": [
        {
          "candidate_id": "C-003",
          "reason": "specific reason — e.g. FSM coverage
                     insufficient to construct a complete trace,
                     or spec is genuinely ambiguous on whether
                     this is missing or by design after searching"
        }
      ]
    }
  
