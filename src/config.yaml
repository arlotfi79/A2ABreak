    ---
    WHAT TO REPORT

    For each candidate:
      - Concrete attack scenario: who does what, what they
        gain, why the protocol cannot prevent it
      - FSM trace: specific states and transitions
      - Missing primitive: what mechanism is absent
      - Why full compliance does not help
      - Spec sections searched
      - Preliminary confidence: HIGH | MEDIUM | LOW

    Do NOT assign severity. Do NOT report structural FSM
    issues unless they enable a concrete attack.

