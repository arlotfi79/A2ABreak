  stage_c1_retry_v2: |
    You are performing a second-pass security analysis of the A2A
    protocol. A first pass has already been completed. Your task
    is to find NEW vulnerabilities the first pass missed.

    The authoritative source is:
    https://a2a-protocol.org/latest/specification/
    Use web search to verify any claim before reporting.

    You will receive:
      - unified_fsm: the complete protocol FSM
      - excluded_areas: topics already analyzed (do not revisit)
      - protocol_operations: inventory of operations and data
        types to examine systematically

    ---
    FUNDAMENTAL ASSUMPTION

    Every MUST, SHOULD, RECOMMENDED, and MAY in the specification
    is assumed fully satisfied by all parties at all times.

    A vulnerability is valid ONLY if the flaw exists in something
    the protocol does not say — a missing primitive, an undefined
    trust root, or an absent mechanism.

    NOTE: do not discard because an implementation COULD add a
    protective mechanism not currently defined in the spec. Only
    discard if the current spec itself prevents the attack through
    an existing normative rule.

    ---
    MISSING vs BY DESIGN

    MISSING PRIMITIVE: the protocol needed to define something
      and did not. Valid finding.
    INTENTIONAL EXCLUSION: the protocol explicitly excluded the
      mechanism from scope. Not a valid finding.

    Vague delegation ("each agent defines its own model") is NOT
    intentional exclusion. Search the spec before deciding.

    ---
    WHERE TO LOOK

    The first pass found findings concentrated in authentication,
    authorization, and credential lifecycle. Those areas are
    exhausted. You MUST look elsewhere.

    Think about what guarantees a client or server relies on
    that the protocol does not enforce:
      - Can data be tampered with between creation and consumption?
      - Can concurrent operations create inconsistent state?
      - Can protocol features be combined in unintended ways?
      - Can claims made in one phase be contradicted in another?
      - Can a participant observe or infer information they
        should not through protocol-defined operations?
      - Can protocol mechanisms be abused for resource
        amplification beyond what has already been found?

    Examine these vulnerability classes systematically:

    DATA INTEGRITY: Are artifacts, messages, or streaming events
      integrity-protected? Can intermediaries tamper with them
      in multi-agent chains? Is there cryptographic binding
      between data and its originating task/agent?

    CONCURRENCY: The spec allows multiple concurrent streams
      per task and parallel tasks per context. What happens
      under concurrent access? Are state transitions atomic?
      Can concurrent mutations create inconsistent views?

    EVENT ORDERING & REPLAY: Can events be replayed, reordered,
      or silently dropped across reconnection boundaries?
      What happens to events missed during disconnection when
      the spec says replay is "implementation-dependent"?

    CAPABILITY & SKILL CLAIMS: Agent Cards declare skills and
      capabilities. Are these verifiable? Can an agent attract
      tasks by claiming capabilities it lacks?

    EXTENSION SECURITY: Extensions add arbitrary functionality.
      What security boundaries exist? Can extensions bypass
      core protocol constraints?

    PROTOCOL NEGOTIATION: Version negotiation, transport
      selection. Can these be manipulated to downgrade
      security properties?

    STATE MACHINE CONSISTENCY: Can the task state machine
      reach states through unexpected paths? Can client and
      server have inconsistent views of task state?

    ---
    FILTERS

    Before reporting any candidate, apply all filters.
    Discard silently if any fails.

    1. NOT IN EXCLUDED AREAS (check the exclusion list)
    2. ATTACK STAYS WITHIN PROTOCOL (no out-of-band mechanisms)
    3. NOT AN INTENTIONAL DESIGN CHOICE (search spec first)
    4. NOT PREVENTABLE BY ANY EXISTING NORMATIVE RULE under
